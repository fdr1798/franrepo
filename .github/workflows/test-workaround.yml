name: Test setup-cli workaround

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate stale file
        run: |
          mkdir -p "$RUNNER_TEMP/.bin"
          echo "stale" > "$RUNNER_TEMP/.bin/CHANGELOG.md"

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.1.0
